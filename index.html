<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>椅子フォトグラム</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class = "senter">
    <h1>椅子フォト</h1>
    </div>
  </header>

  <main>
    <section id="about">
      <div class = "senter">
      <h2>諸行無常</h2>
      <p>すべてのものは絶えず変化していく</p>
      </div>
      <div class="photo-grid">
        <figure class="photo-card">
          <button class="photo-card__open" type="button">
            <img src="images/IMG_7378.JPEG" alt="木と月">
          </button>
          <figcaption>
            <span>木と月</span>
          </figcaption>
        </figure>
       
        <figure class="photo-card">
          <button class="photo-card__open" type="button">
            <img src="images/IMG_7740.JPEG" alt="落ち込んだ花">
          </button>
          <figcaption>
            <span>落ち込んだ花</span>
          </figcaption>
        </figure>
        
        <figure class="photo-cord">
          <button class="photo-card__open" type="button">
            <img src="images/IMG_7754.JPEG" alt="家と三日月">
          </button>
          <figcaption>
            <span>家と三日月</span>
          </figcaption>
        </figure>
        
        <figure class="photo-cord">
          <button class="photo-card__open" type="button">
            <img src="images/IMG_7745.JPEG" alt="山と三日月">
          </button>
          <figcaption>
            <span>山と三日月</span>
          </figcaption>
        </figure>      
      </div>
    </section>
  </main>

  <footer>
<div class = "senter">
    <p><small>&copy; 2026 椅子フォトグラム</small></p>
  </div>
  </footer>
</body>
</html>
