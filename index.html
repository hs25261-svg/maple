<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>椅子蜜柑プロジェクト文豪ネットウェブ</title>
  <style>
body {

      font-family: "Yu Mincho", "Noto Serif JP", serif;
      line-height: 1.9;
      margin: 0;
      padding: 0;
      background: #D8D8CD;
      color: #4A5147;
    }

    header, main, footer {
     max-width: 900px;
     margin: 0 auto;
     padding: 30px;

    }

    header {
       border-bottom: 1px solid #B7B5A8;

    }

    header h1 {
      font-size: 36px;
      letter-spacing: 0.2em;
      font-weight: normal;

    }

    nav a {
     color: #4A5147;
      text-decoration: none;
      margin-right: 24px;
      font-size: 14px;

    }

    nav a:hover {
      color: #85897A;
    }

    main {
      min-height: 500px;

    }

    section {
      margin: 60px 0;

    }

    h2 {
      font-weight: normal;
      border-bottom: 1px solid #B7B5A8;
      padding-bottom: 10px;

    }

    footer {
      border-top: 1px solid #B7B5A8;
      font-size: 13px;
      color: #85897A;
      text-align: center;

    }

  </style>

</head>

<body>

  <header>
    <h1>文人録</h1>

    <nav>

      <a href="#about">文人録について</a>

      <a href="#writers">文人一覧</a>

    </nav>

  </header>

  <main>

    <section id="about">

      <h2>文人録について</h2>

      <p>

        文人たちの生涯、作品、思想を記録する。

      </p>

    </section>

    <section id="writers">

      <h2>文人一覧</h2>

      <p>ここに作家の名前や紹介を掲載します。</p>

    </section>

  </main>

  <footer>

    <p>文人録 — 文学と思想の記録</p>

  </footer>

</body>

</html>
